# Source validation, package construction, and published-release verification.
#
# Trust boundaries:
#   * Pull requests, pushes and tags build and validate source; they never
#     publish and never receive write credentials.
#   * The published-release job downloads assets from a GitHub Release and
#     inspects them as data.  It does not execute tagged source or downloaded
#     packages.  Its validation logic comes from the current trusted branch.
#   * Privileged network-namespace jobs (dataplane and IPv6-only) run only on
#     trusted refs (push, tag, release, manual dispatch), never on pull
#     requests, so untrusted code is not executed with CAP_NET_ADMIN.
#   * A release published with GITHUB_TOKEN does not start another workflow
#     run (GitHub suppresses recursive token-triggered runs), so the release
#     event and the manual workflow_dispatch path are both supported.

name: Release validation

on:
  push:
    branches:
      - main
      - 'ci/**'
    tags:
      - 'v*'
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to verify (for example v0.2.2)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned analysis tools
        run: ./scripts/install-ci-tools.sh "$RUNNER_TEMP/ci-tools"

      - name: Add analysis tools to PATH
        run: printf '%s\n' "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"

      - name: Validate workflow definitions
        run: actionlint -color

      - name: Audit workflow security
        run: zizmor --offline --collect all --format plain .github

      - name: Check shell scripts
        run: |
          shellcheck --version
          shellcheck install.sh scripts/*.sh test/*.sh test/lib/*.sh \
            debian/*.preinst debian/*.postinst debian/*.prerm debian/*.postrm \
            src/vyatta-vxlan src/vyatta-vxlan-bridge src/vyatta-vxlan-firewall

      - name: Check Perl syntax
        run: perl -c src/vyatta-vxlan-addr >/dev/null

  package:
    name: Build and validate packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Check changed lines for whitespace errors
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ./scripts/check-whitespace.sh

      - name: Install build and validation dependencies
        run: |
          ./scripts/apt-update-ubuntu-only.sh
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dpkg-dev \
            fakeroot \
            kmod \
            lintian

      - name: Run off-device test suite
        run: bash test/run.sh

      - name: Build Debian packages (canonical)
        run: ./scripts/build-reproducible.sh --output-dir ci-artifacts

      - name: Capture build environment
        run: ./scripts/capture-build-environment.sh ci-artifacts/provenance/build-environment.txt

      - name: Validate build artifacts
        run: ./scripts/validate-release.sh ci-artifacts

      - name: Run negative artifact-validation tests
        run: bash test/validate-release-negative.sh ci-artifacts

      - name: Run lintian
        run: |
          VERSION=$(dpkg-parsechangelog -S Version)

          lintian \
            --suppress-tags-from-file .github/lintian-suppressions.txt \
            --fail-on error \
            --tag-display-limit 0 \
            "ci-artifacts/edgeos-vxlan-kmod_${VERSION}_mipsel.deb" \
            "ci-artifacts/edgeos-vxlan_${VERSION}_all.deb"

      - name: Upload packages and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edgeos-vxlan-ci-packages-nonrelease
          path: ci-artifacts/
          if-no-files-found: error
          compression-level: 0

  reproducibility:
    name: Reproducibility verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          ./scripts/apt-update-ubuntu-only.sh
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev fakeroot

      - name: Build twice and compare
        run: |
          ./scripts/verify-reproducible-build.sh \
            --source-rev HEAD \
            --work-dir "$RUNNER_TEMP/reproducibility"

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducibility-diagnostics
          path: ${{ runner.temp }}/reproducibility
          if-no-files-found: warn
          compression-level: 0

  published-fixtures:
    name: Published-release fixtures
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify published-release fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash test/published-release-fixtures.sh

  # The netns dataplane test needs root and a real network namespace.  Keep it
  # off untrusted pull-request refs; it still runs on main, trusted branches,
  # tags, releases and manual dispatch.
  dataplane:
    name: Network-namespace dataplane
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare dataplane test tools
        run: |
          missing=0
          for cmd in ip iptables ip6tables ping python3; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "NOTICE: $cmd is not present in the runner image" >&2
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "All dataplane tools are already present; no package acquisition."
            exit 0
          fi
          ./scripts/apt-update-ubuntu-only.sh
          sudo apt-get install -y --no-install-recommends \
            iproute2 iptables iputils-ping python3

      - name: Enable VXLAN modules
        run: |
          sudo modprobe vxlan udp_tunnel ip6_udp_tunnel

      - name: Linux network-namespace dataplane test
        env:
          REQUIRE_NETNS_TEST: "1"
        run: |
          sudo -E bash test/integration-netns.sh

  # Level B qualification: an isolated IPv6-only network-namespace topology.
  # This job runs on trusted events only.  The runner and GitHub control plane
  # remain dual-stack; that is Level D and is explicitly not claimed.
  ipv6-only:
    name: IPv6-only qualification
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify IPv6-only test tooling
        run: |
          missing=0
          for cmd in ip ping python3 timeout awk sed grep; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "ERROR: required tool missing from the runner image: $cmd" >&2
              missing=1
            fi
          done
          if command -v tcpdump >/dev/null 2>&1; then
            echo "Packet capture: tcpdump is available."
          else
            echo "Packet capture: tcpdump is unavailable; capture evidence will be recorded as skipped."
          fi
          exit "$missing"

      - name: Enable VXLAN modules
        run: |
          sudo modprobe vxlan udp_tunnel ip6_udp_tunnel

      - name: Establish and qualify the isolated IPv6-only topology
        env:
          REQUIRE_NETNS_TEST: "1"
          REQUIRE_CAPTURE: "0"
          REQUIRE_RECONCILER: "1"
          EVIDENCE_DIR: ${{ runner.temp }}/ipv6-only-evidence
        run: |
          sudo -E bash test/ipv6-only-netns.sh

      - name: Upload IPv6-only evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipv6-only-qualification-evidence
          path: ${{ runner.temp }}/ipv6-only-evidence
          if-no-files-found: warn
          compression-level: 0

      - name: Clean up isolated namespaces
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/ipv6-only-evidence
        run: |
          sudo -E bash test/ipv6-only-netns.sh --cleanup

  published-release:
    name: Verify published release
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-verification-${{ github.event.release.tag_name || inputs.release_tag }}
      cancel-in-progress: false

    steps:
      - name: Resolve and validate release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          lines=$(printf '%s\n' "$TAG" | wc -l)
          if [ "$lines" -ne 1 ]; then
            echo "ERROR: release tag must be a single line" >&2
            exit 1
          fi

          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: release tag must match vMAJOR.MINOR.PATCH: '$TAG'" >&2
            exit 1
          fi

          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out trusted validation logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release events use the default branch.  Manual dispatch may use a
          # selected branch (dispatching requires write access), but never a
          # tag: a tag must not certify its own assets with older logic.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref || github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Check out tagged release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: tagged-source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify release metadata and tag ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          metadata=$(gh release view "$TAG" --repo "$REPO" \
            --json tagName,isDraft,isPrerelease,targetCommitish \
            --jq '[.tagName, (.isDraft|tostring), (.isPrerelease|tostring), (.targetCommitish // "")] | @tsv')

          tag_name=$(printf '%s\n' "$metadata" | cut -f1)
          is_draft=$(printf '%s\n' "$metadata" | cut -f2)
          is_prerelease=$(printf '%s\n' "$metadata" | cut -f3)
          target=$(printf '%s\n' "$metadata" | cut -f4)

          [ "$tag_name" = "$TAG" ] ||
            { echo "ERROR: release metadata returned tag '$tag_name', expected '$TAG'" >&2; exit 1; }
          [ "$is_draft" = "false" ] ||
            { echo "ERROR: release $TAG is still a draft" >&2; exit 1; }
          [ "$is_prerelease" = "false" ] ||
            { echo "ERROR: release $TAG is marked as a prerelease" >&2; exit 1; }

          status=$(gh api "repos/$REPO/compare/$TAG...$DEFAULT_BRANCH" --jq '.status')
          case "$status" in
            ahead|identical)
              ;;
            *)
              echo "ERROR: release tag $TAG is not contained in $DEFAULT_BRANCH (compare status: $status)" >&2
              exit 1
              ;;
          esac

          echo "Release $TAG is published and contained in $DEFAULT_BRANCH (status: $status; target: $target)."

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p published
          gh release download "$TAG" --repo "$REPO" --dir published

      - name: Validate published release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: ./scripts/validate-published-release.sh published tagged-source
