name: Release validation

on:
  push:
    branches:
      - main
      - 'ci/**'
    tags:
      - 'v*'
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to validate
        required: false
        default: v0.2.1
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            crossbuild-essential-mipsel \
            debhelper \
            devscripts \
            fakeroot \
            shellcheck

      - name: Source sanity
        run: |
          sh -n install.sh
          sh -n scripts/validate-release.sh
          sh -n scripts/validate-published-release.sh
          shellcheck install.sh scripts/*.sh
          git diff --check

      - name: Build Debian packages
        run: |
          dpkg-buildpackage -us -uc -b -a mipsel

      - name: Validate release artifacts
        run: |
          ./scripts/validate-release.sh

      - name: Show package contents
        run: |
          VERSION=$(dpkg-parsechangelog -S Version)

          dpkg-deb -c \
            "../edgeos-vxlan-kmod_${VERSION}_mipsel.deb" \
            | grep -E 'vxlan\.ko|udp_tunnel\.ko'

          dpkg-deb -f \
            "../edgeos-vxlan_${VERSION}_all.deb" \
            Version Architecture Depends

          dpkg-deb -f \
            "../edgeos-vxlan-kmod_${VERSION}_mipsel.deb" \
            Version Architecture

      - name: Stage CI artifacts
        run: |
          VERSION=$(dpkg-parsechangelog -S Version)

          mkdir -p ci-artifacts
          cp \
            "../edgeos-vxlan-kmod_${VERSION}_mipsel.deb" \
            "../edgeos-vxlan_${VERSION}_all.deb" \
            ci-artifacts/

          (
            cd ci-artifacts
            sha256sum *.deb > SHA256SUMS
          )

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: edgeos-vxlan-packages
          path: ci-artifacts/
  published-release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out CI source
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out tagged release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: tagged-source

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published
          gh release download \
            "${{ steps.release.outputs.tag }}" \
            --dir published

      - name: Validate published release
        run: |
          ./scripts/validate-published-release.sh \
            published \
            tagged-source
