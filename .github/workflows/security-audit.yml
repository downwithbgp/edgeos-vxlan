name: Supply-chain security audit

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Online workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned analysis tools
        run: ./scripts/install-ci-tools.sh "$RUNNER_TEMP/ci-tools"
      - name: Add analysis tools to PATH
        run: printf '%s\n' "$RUNNER_TEMP/ci-tools" >> "$GITHUB_PATH"
      - name: Audit workflows online
        run: zizmor --collect all --format plain .github
      - name: Validate workflow definitions
        run: actionlint -color
